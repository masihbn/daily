<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Do NOT set this to "black-translucent". Measured on-device (2026-08-22)
     in the installed standalone PWA on iOS: black-translucent makes iOS
     draw the web view at the physical top of the screen (content under the
     notch) but SIZE it as (screen height - status bar height), leaving a
     59pt strip of bare screen uncovered at the bottom (screen.height 852 -
     window.innerHeight 793 = 59, exactly safe-area-inset-top). That strip
     is outside the web view entirely, so no CSS can paint it. This is
     invisible in Safari because Safari's own toolbar covers that region —
     it only shows up in installed standalone mode. "black" positions the
     web view below the status bar and sizes it correctly, so it reaches
     the true bottom of the screen. Restoring "black-translucent" for
     aesthetics will silently reintroduce the bug. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- Step U.7 (CONTRACT-U.7.md §4): two scheme-scoped theme-color tags,
     replacing the single pre-design-system #111111 value — the browser
     picks whichever `media` matches the OS scheme. -->
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Step U.1: the permanent "Daily" header is gone — each route sets its own
     title here via js/main.js's setTitle() (large title on the three tab
     routes, compact + a back button on detail/new/edit; compact, no back on
     sign-in/lock). data-size drives the large-vs-compact CSS. The back
     button's SVG is injected at bootstrap (uiIconSvg('back')), never
     hardcoded here — see docs/DESIGN_PLAN.md Step U.1 §0/§1. -->
<header id="title-bar" class="title-bar" data-size="large">
  <div class="title-bar__row">
    <a id="title-back" class="title-bar__back btn btn--icon btn--ghost" href="#/" hidden aria-label="Back"></a>
    <h1 id="title" class="title-bar__title">Daily</h1>
    <!-- Step U.2 (CONTRACT-U.2 §2): date subtitle under the Home large title.
         Empty/hidden by default; js/main.js's setTitle() fills it in only
         when a route passes a `sub` string (Home only, as of U.2). -->
    <p id="title-sub" class="title-bar__sub" hidden></p>
  </div>
  <!-- Step D.6: global unsent-writes indicator. Lives in the shell, not in a
       view, because the whole point is that it is visible from every route —
       the per-row pending state on Home only helps if you are on Home. Empty
       and hidden until js/outbox-sync.js finds queued writes.
       role="status" so VoiceOver announces it without stealing focus. -->
  <p id="outbox-status" class="outbox-status pill pill--warn" role="status" aria-live="polite" data-count="0" hidden></p>
  <!-- Step 5.1: visible offline indicator, driven by navigator.onLine and
       the online/offline events (js/net-status.js). Different fact from
       the per-view "you appear to be offline" banners: this means "the
       browser currently believes there is no network," i.e. the app is
       serving last-known cached data. -->
  <p id="net-status" class="net-status pill" role="status" aria-live="polite" data-online="true" hidden></p>
</header>
<div id="app"></div>
<nav id="nav" class="tab-bar">
  <a href="#/" data-route="home">Home</a>
  <a href="#/compare" data-route="compare">Compare</a>
  <a href="#/settings" data-route="settings">Settings</a>
</nav>

<!-- Chart.js v4 + annotation plugin, pinned exact versions (never @latest —
     a silent major bump would break the installed app with no deploy).
     Plain UMD <script> tags, loaded before js/main.js so window.Chart
     exists for later steps. Nothing uses them yet in this step; they are
     loaded now so the service worker caches them for offline use. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>

<script type="module" src="js/main.js"></script>
</body>
</html>
