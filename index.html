<!-- Chart.js v4 + annotation plugin, pinned exact versions (never @latest —
     a silent major bump would break the installed app with no deploy).
     Plain UMD <script> tags, loaded before js/main.js so window.Chart
     exists for later steps. Nothing uses them yet in this step; they are
     loaded now so the service worker caches them for offline use. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>

<script type="module" src="js/main.js"></script>
</body>
